<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    line-height: 1.5;
    background: #0f0f11;
    color: #e8e8ed;
    padding: 16px;
  }
  h1 { font-size: 14px; font-weight: 600; color: #818cf8; margin-bottom: 4px; }
  p { color: #9898a3; }
  .card {
    background: #1a1a1f;
    border: 1px solid #2e2e35;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
  }
  .count { font-size: 22px; font-weight: 600; color: #e8e8ed; }
  .names { color: #9898a3; word-break: break-word; }
  button {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 9px 12px;
    border: 1px solid #2e2e35;
    border-radius: 6px;
    background: #242429;
    color: #e8e8ed;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #2e2e35; }
  button.primary { background: #6366f1; border-color: #6366f1; color: #fff; }
  button.primary:hover:not(:disabled) { background: #818cf8; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress { height: 4px; background: #2e2e35; border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .progress-fill { height: 100%; width: 0; background: #6366f1; transition: width 0.15s; }
  .error { color: #ef4444; margin-top: 8px; }
  .ok { color: #10b981; }
  .warnings { margin-top: 8px; color: #f59e0b; max-height: 90px; overflow: auto; }
  .warnings li { margin-left: 16px; }
  .hidden { display: none; }
  #copy-buffer { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
  <h1>FigToCSS Exporter</h1>
  <p>Export the selected layers, then load the file in the FigToCSS web app. No API token or rate limits.</p>

  <div class="card">
    <div class="count" id="count">0</div>
    <div class="names" id="names">Nothing selected</div>
    <button class="primary" id="export-btn" disabled>Export selection</button>
    <div id="progress-box" class="hidden">
      <p id="progress-label">Working…</p>
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <p class="error hidden" id="error"></p>
  </div>

  <div class="card hidden" id="result-box">
    <p class="ok" id="result-summary"></p>
    <button class="primary" id="download-btn">Download .figtocss.json</button>
    <button id="copy-btn">Copy to clipboard</button>
    <ul class="warnings hidden" id="warnings"></ul>
  </div>

  <textarea id="copy-buffer" aria-hidden="true" tabindex="-1"></textarea>

<script>
  var exportJson = '';
  var exportFileName = 'export';

  var el = function (id) { return document.getElementById(id); };

  function formatSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return Math.max(1, Math.round(bytes / 1024)) + ' KB';
  }

  function safeName(name) {
    return String(name || 'export').replace(/[^a-zA-Z0-9_-]+/g, '-').replace(/^-+|-+$/g, '') || 'export';
  }

  function show(id, visible) {
    el(id).classList.toggle('hidden', !visible);
  }

  el('export-btn').onclick = function () {
    show('error', false);
    show('result-box', false);
    show('progress-box', true);
    el('progress-label').textContent = 'Starting…';
    el('progress-fill').style.width = '0%';
    el('export-btn').disabled = true;
    parent.postMessage({ pluginMessage: { type: 'export' } }, '*');
  };

  el('download-btn').onclick = function () {
    var blob = new Blob([exportJson], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = exportFileName + '.figtocss.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  };

  el('copy-btn').onclick = function () {
    var buffer = el('copy-buffer');
    buffer.value = exportJson;
    buffer.focus();
    buffer.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    buffer.value = '';
    el('copy-btn').textContent = ok ? 'Copied!' : 'Copy failed — use Download';
    setTimeout(function () { el('copy-btn').textContent = 'Copy to clipboard'; }, 2000);
  };

  window.onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'selection') {
      el('count').textContent = msg.count + (msg.count === 1 ? ' layer selected' : ' layers selected');
      el('names').textContent = msg.count ? msg.names.join(', ') + (msg.count > msg.names.length ? '…' : '') : 'Nothing selected';
      if (el('progress-box').classList.contains('hidden')) {
        el('export-btn').disabled = msg.count === 0;
      }
    } else if (msg.type === 'progress') {
      var pct = msg.total ? Math.round((msg.done / msg.total) * 100) : 0;
      el('progress-label').textContent = msg.label + ' (' + (msg.done + 1) + '/' + msg.total + ')';
      el('progress-fill').style.width = pct + '%';
    } else if (msg.type === 'done') {
      show('progress-box', false);
      el('export-btn').disabled = false;
      exportJson = JSON.stringify(msg.result);
      exportFileName = safeName(msg.result.fileName);
      var size = new Blob([exportJson]).size;
      var counts = Object.keys(msg.result.images).length + ' images, ' +
        Object.keys(msg.result.svgs).length + ' vectors';
      el('result-summary').textContent = 'Export ready: ' + formatSize(size) + ' (' + counts + ')';
      var list = el('warnings');
      list.innerHTML = '';
      (msg.result.warnings || []).forEach(function (w) {
        var li = document.createElement('li');
        li.textContent = w;
        list.appendChild(li);
      });
      show('warnings', list.children.length > 0);
      show('result-box', true);
    } else if (msg.type === 'error') {
      show('progress-box', false);
      el('export-btn').disabled = false;
      el('error').textContent = msg.message;
      show('error', true);
    }
  };
</script>
</body>
</html>
